<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>



    <form action="/submit" method="POST">


        <label for="name1">    Name:   </label>
        <input type="text" id="name1" name="name1" required>
    
        <label for="pwd">Password:</label>
        <input type="password" id="pwd" name="pwd" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <label for="num">Enter your Fav Number</label>
        <input type="number" id="num" name="num" required><br>

        <label for="dob">Enter your Date of Birth</label>
        <input type="date" id="dob" name="dob" required><br><br>

        <label for="reg-no" >Enter your Registration Number</label>
        <input type="text" id="reg-no" name="reg-no" placeholder="FA22-BCS-001" required><br><br>




        <button type="submit">Submit</button><br><br>


        <input type="checkbox" name="topic" value="html" checked> HTML
        <input type="checkbox" name="topic" value="css"> CSS
        <input type="checkbox" name="topic" value="js"> JavaScript<br><br>

        <input type="radio" name="level" value="beginner" checked> Beginner
        <input type="radio" name="level" value="intermediate"> Intermediate
        <input type="radio" name="level" value="advanced"> Advanced<br><br>



    </form>


</body>
</html>
