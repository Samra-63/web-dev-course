<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lecture 4 Practice</title>
</head>
<body>
    <h2>Student Registration Form</h2>

    <form action="/submit" method="POST">
        <lable for="name" > Full Name</lable><br>
        <input type="text" id="name" name="name" placeholder="Enter your full name" required><br><br>

        <lable for="email"> Email</lable><br>
        <input type="email" id="email" name="email" placeholder="Enter your email" required><br><br>

        <lable for="password"> Password</lable><br>
        <input type="password" id="password" name="password" placeholder="Enter your password" required><br><br>

        <label for="age"> Age</label><br>
        <input type="number" id="age" name="age" placeholder="Enter your age" required><br><br>

        <lable for="dob"> Date of Birth</lable><br>
        <input type="date" id="dob" name="dob" required><br><br>

        <label for="city"> City</label><br>
        <input type="text" id="city" name="city" value="Attock" required><br><br>


        <p>Which Subjects do you like?(Chooose any number)</p>

        <input type="checkbox" id="math" name="subject" value="Math">
        <label for="math">Math</label><br>

        <input type="checkbox" id="science" name="subject" value="Science">
        <label for="science">Science</label><br>

        <input type="checkbox" id="english" name="subject" value="English">
        <label for="english">English</label><br>

        <p>What is your level of education?</p>

        <input type="radio" id="highschool" name="education" value="High School">
        <label for="highschool">High School</label><br>

        <input type="radio" id="intermediate" name="education" value="Intermediate">
        <label for="intermediate">Intermediate</label><br>

        <input type="radio" id="bachelor" name="education" value="Bachelor">
        <label for="bachelor">Bachelor</label><br><br>

        <button type="submit"> Register</button><br><br>





















    </form>
    
</body>
</html>
